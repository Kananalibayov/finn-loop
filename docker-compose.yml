# AC-4, AC-5 (issue #15): single-command deployment.
#   docker compose up -d
#
# - Builds the image from ./Dockerfile (linux/amd64).
# - Publishes port 3000 (override via PORT env).
# - Mounts a named volume at /app/data so SQLite persists across restarts.
# - Mounts the host .env read-only at /app/.env so secrets load without being
#   baked into the image.
#
# Secrets are NOT in this file — they live in .env on the host (see DEPLOY.md).

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: ai-website-generator:latest
    container_name: ai-website-generator
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    volumes:
      # AC-4: persistent named volume for the SQLite DB + uploads.
      - app-data:/app/data
      # AC-4: read-only mount of the host .env so secrets aren't baked in.
      - ./.env:/app/.env:ro
    # DATABASE_FILE and HOSTNAME are already set in the Dockerfile ENV; if you
    # need to override them per-deploy, uncomment and set here or in .env.
    # environment:
    #   DATABASE_FILE: /app/data/app.db

volumes:
  app-data:
