name: finn-gate

# The single mechanical gate between "a reviewer LLM approved this" and "GitHub may
# auto-merge it". No LLM ever merges; GitHub's native auto-merge does, and it only
# proceeds when this check passes (make it a required status check on main).
#
# Every condition here is deterministic. Nothing in this workflow asks a model anything.

on:
  pull_request:
    types: [opened, reopened, synchronize, labeled, unlabeled]

permissions:
  contents: write # only to enable GitHub's native auto-merge; never a direct merge
  pull-requests: write # to post the dry-run comment / manage the would-auto-merge label

concurrency:
  group: finn-gate-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Evaluate gate
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          set -euo pipefail
          # Two different outcomes, deliberately distinguished:
          #
          #   block <reason>  -> the check goes RED. Something is wrong: no review, or the
          #                      review is stale. Nothing should merge, by hand or otherwise.
          #
          #   hold <reason>   -> the check stays GREEN but auto-merge is NOT enabled. Nothing
          #                      is wrong; this change just needs a deliberate human. If this
          #                      went red instead, then once `gate` becomes a required check
          #                      every protected-path PR would be unmergeable without an admin
          #                      bypass - a deadlock, since most infrastructure work touches
          #                      protected paths.
          block() { echo "BLOCKED: $1"; echo "reason=$1" >> "$GITHUB_OUTPUT"; echo "pass=false" >> "$GITHUB_OUTPUT"; echo "verdict=block" >> "$GITHUB_OUTPUT"; exit 0; }
          hold()  { echo "HELD FOR HUMAN: $1"; echo "reason=$1" >> "$GITHUB_OUTPUT"; echo "pass=false" >> "$GITHUB_OUTPUT"; echo "verdict=hold" >> "$GITHUB_OUTPUT"; exit 0; }

          # ---- 1. Labels -------------------------------------------------------
          labels=$(gh pr view "$PR" --json labels --jq '[.labels[].name] | join(",")')
          echo "Labels: $labels"

          case ",$labels," in
            *,needs-human-review,*) hold "needs-human-review is present" ;;
          esac
          case ",$labels," in
            *,loop-approved,*) ;;
            *) block "loop-approved is absent" ;;
          esac

          # ---- 2. Reviewed SHA must equal current head -------------------------
          # finn-t3 posts a comment whose FIRST line is exactly:
          #   Finn-loop review of <40-char sha>
          # GitHub does not strip labels when new commits land, so this is the only
          # thing proving the approved code is the code about to merge.
          reviewed=$(gh pr view "$PR" --json comments \
            --jq '[.comments[].body
                   | split("\n")[0]
                   | capture("^Finn-loop review of (?<sha>[0-9a-f]{40})\\s*$")?
                   | .sha] | last // ""')
          # Strip any surrounding quotes and CR, so this works regardless of whether
          # gh emits raw or JSON-quoted scalars.
          reviewed=$(printf '%s' "$reviewed" | tr -d '"\r' | tr -d '[:space:]')

          if [ -z "$reviewed" ]; then
            block "no 'Finn-loop review of <sha>' comment found"
          fi
          if [ "$reviewed" != "$HEAD_SHA" ]; then
            block "review is stale: reviewed $reviewed but head is $HEAD_SHA"
          fi
          echo "Reviewed SHA matches head: $HEAD_SHA"

          # ---- 3. Linked issue tier (informational only) -----------------------
          # tier:t3 no longer forces a hold here — the user has explicitly opted
          # into full autonomy for GPT-5.6/Kimi-reviewed PRs, tier:t3 included,
          # until told otherwise. The diff-based checks below (protected paths,
          # dangerous content, the client_id landmine) remain the real backstop
          # regardless of tier.
          body=$(gh pr view "$PR" --json body --jq .body)
          issue=$(printf '%s' "$body" | grep -oiE 'closes #[0-9]+' | head -1 | grep -oE '[0-9]+' || true)
          if [ -n "$issue" ]; then
            itiers=$(gh issue view "$issue" --json labels --jq '[.labels[].name] | join(",")' || echo "")
            echo "Linked issue #$issue labels: $itiers"
          else
            echo "No linked issue found in PR body (not fatal for this gate)"
          fi

          # ---- 4. Protected paths ---------------------------------------------
          git fetch --quiet origin "$BASE_REF"
          changed=$(git diff --name-only "origin/$BASE_REF...$HEAD_SHA")
          echo "Changed files:"; echo "$changed"

          # Governance files are protected too: a builder that can edit ROADMAP.md could
          # add a line and then cite it as its own authorisation in the same session.
          protected='^(lib/auth\.ts|middleware\.ts|lib/db\.ts|lib/plesk\.ts|lib/wp\.ts|lib/net\.ts|Dockerfile|docker-compose\.yml|package\.json|package-lock\.json|tsconfig\.json|next\.config\.mjs|\.nvmrc|\.github/workflows/.*|\.zcode/skills/.*|\.github/CODEOWNERS|AGENTS\.md|ROADMAP\.md|docs/.*)$'
          if hit=$(printf '%s\n' "$changed" | grep -E "$protected" | head -3); then
            if [ -n "$hit" ]; then
              hold "touches protected path(s): $(printf '%s' "$hit" | tr '\n' ' ')"
            fi
          fi

          # ---- 5. Dangerous content ------------------------------------------
          # Path lists miss semantics: a tier:t2 PR can add lib/sessionHelper.ts, or
          # inline ALTER TABLE in a route handler, and evade any filename check.
          diff=$(git diff "origin/$BASE_REF...$HEAD_SHA" -- . ':(exclude)*.test.mts' ':(exclude)docs/**' ':(exclude)*.md')
          patterns='jwt\.sign|jwtVerify|SignJWT|bcrypt|hashSync|compareSync|process\.env\.[A-Za-z_]*(SECRET|KEY|TOKEN|PASSWORD)|ALTER TABLE|CREATE TABLE|DROP TABLE|child_process|exec\(|eval\(|timingSafeEqual|randomBytes|Math\.random'
          # Added lines only (grep '^\+'), excluding the '+++ b/path' file header so a
          # filename can never trip a content rule.
          added=$(printf '%s\n' "$diff" | grep -E '^\+' | grep -vE '^\+\+\+ ')
          if printf '%s\n' "$added" | grep -qE "$patterns"; then
            found=$(printf '%s\n' "$added" | grep -oE "$patterns" | sort -u | head -3 | tr '\n' ' ')
            hold "added dangerous content: $found"
          fi

          # ---- 5b. Ledger-specific regressions --------------------------------
          # Each of these is a defect class GAP-LEDGER already documents, expressed as
          # something the diff can be checked for. CI cannot see any of them.
          if printf '%s\n' "$added" | grep -q 'dangerouslySetInnerHTML'; then
            hold "adds dangerouslySetInnerHTML — model output must never reach an unsanitised sink"
          fi
          # A new srcDoc iframe without sandbox re-opens the stored-XSS path closed by #94.
          if printf '%s\n' "$added" | grep -q 'srcDoc' && ! printf '%s\n' "$added" | grep -q 'sandbox'; then
            hold "adds a srcDoc iframe with no sandbox attribute (see GAP-LEDGER blocker 6)"
          fi
          # A new API route with no authorization. lib/route-auth.test.mts is the real gate
          # for this, but catching it here gives a faster, clearer signal.
          newroutes=$(printf '%s\n' "$changed" | grep -E '^app/api/.*/route\.ts$' || true)
          for r in $newroutes; do
            if [ -f "$r" ] && ! grep -qE 'requireRole|requireAdmin|verifySessionRole|verifySession|verifyHealthSecret|consumeLoginToken' "$r"; then
              hold "route $r has no in-handler authorization (GAP-LEDGER §8)"
            fi
          done

          # ---- 5c. The client_id landmine -------------------------------------
          # GAP-LEDGER: wiring sites.client_id before the change-request state machine,
          # per-page failure accounting and group-head resolution are merged detonates ~35
          # latent defects at once - "the single most expensive mistake available in this
          # codebase". Until the Phase 0.75 isolation test exists, this must not auto-merge.
          if [ ! -f "lib/portal-isolation.test.mts" ]; then
            if printf '%s\n' "$added" | grep -qE 'assignProjectToClient|client_id\s*=|set client_id'; then
              hold "touches client_id / assignProjectToClient before lib/portal-isolation.test.mts exists (ROADMAP Phase 0.75)"
            fi
          fi

          # ---- 6. CI must actually be green for THIS commit --------------------
          # A builder's PR body claiming "EXIT=0" is a string it typed; it proves nothing.
          # The only trustworthy evidence is the check run itself, and it must belong to the
          # exact head SHA - a green run against an older commit must not carry a newer one.
          #
          # Branch protection also makes `build` required, so GitHub would hold the merge
          # anyway. Checking here as well means the gate's own verdict is honest rather than
          # asserting "all green" while knowing nothing about CI.
          # The gate finishes in seconds; CI takes about a minute. So wait for `build` to
          # conclude rather than reporting a false block just because it has not started.
          # Bounded well under this job's timeout-minutes.
          build_state="pending"
          for _ in $(seq 1 40); do
            build_state=$(gh api "repos/${GITHUB_REPOSITORY}/commits/${HEAD_SHA}/check-runs" \
              --jq '[.check_runs[] | select(.name=="build")] | last
                    | if . == null then "missing"
                      elif .status != "completed" then .status
                      else (.conclusion // "missing") end' 2>/dev/null || echo "missing")
            case "$build_state" in
              queued|in_progress|pending|missing) sleep 10 ;;
              *) break ;;
            esac
          done
          echo "build check-run for $HEAD_SHA: $build_state"

          case "$build_state" in
            success)        ;;
            skipped)        block "CI 'build' was skipped for $HEAD_SHA" ;;
            missing|queued|in_progress|pending)
                            block "CI 'build' did not report for $HEAD_SHA within the wait window" ;;
            *)              block "CI 'build' is '$build_state' for $HEAD_SHA" ;;
          esac

          echo "All gates green."
          echo "pass=true" >> "$GITHUB_OUTPUT"
          echo "verdict=merge" >> "$GITHUB_OUTPUT"
          echo "reason=all gates green" >> "$GITHUB_OUTPUT"

      - name: Dry-run notice
        if: steps.gate.outputs.pass == 'true' && vars.FINN_AUTOMERGE != 'on'
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          gh pr edit "$PR" --add-label "would-auto-merge" || true
          gh pr comment "$PR" --body \
            "**finn-gate: would auto-merge.** All gates green for \`${{ github.event.pull_request.head.sha }}\`.
          \`FINN_AUTOMERGE\` is not \`on\`, so nothing was merged — this is the dry run. Merge manually if you agree with the verdict."

      - name: Enable GitHub native auto-merge
        if: steps.gate.outputs.pass == 'true' && vars.FINN_AUTOMERGE == 'on'
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          # This does NOT merge. It asks GitHub to merge once every REQUIRED check passes
          # and required reviews are satisfied. finn-gate is itself a required check, so if a
          # later commit lands and this gate goes red, GitHub holds the merge automatically.
          gh pr merge "$PR" --auto --squash
          gh pr comment "$PR" --body \
            "**finn-gate: auto-merge enabled** for \`${{ github.event.pull_request.head.sha }}\`. GitHub will merge once all required checks pass. Push any commit to withdraw it."

      - name: Withdraw auto-merge when not eligible
        if: steps.gate.outputs.pass != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          gh pr edit "$PR" --remove-label "would-auto-merge" || true
          # Explicitly disabling makes the withdrawal visible in the PR timeline rather
          # than leaving a stale "auto-merge enabled" badge on a PR that no longer qualifies.
          gh pr merge "$PR" --disable-auto || true

      - name: Explain a hold
        if: steps.gate.outputs.verdict == 'hold'
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          gh pr comment "$PR" --body \
            "⏸️ **finn-gate: held for a human.** ${{ steps.gate.outputs.reason }}

          Nothing is wrong with this PR — it just is not eligible for auto-merge. Review it and merge it yourself when you are satisfied. The check is green so it does not block you." || true

      - name: Report result
        run: |
          case "${{ steps.gate.outputs.verdict }}" in
            merge)
              echo "finn-gate: eligible for auto-merge — ${{ steps.gate.outputs.reason }}"
              ;;
            hold)
              # GREEN on purpose. A hold means "a human should merge this", not "something is
              # broken". Failing here would make every protected-path PR unmergeable once
              # `gate` is a required check, which is most infrastructure work.
              echo "::notice::finn-gate held for a human: ${{ steps.gate.outputs.reason }}"
              echo "Not eligible for auto-merge, but not blocking. Merge by hand."
              ;;
            *)
              echo "::error::finn-gate blocked: ${{ steps.gate.outputs.reason }}"
              exit 1
              ;;
          esac
