name: finn-gate

# The mechanical guard between a change and `main`. Deliberately small.
#
# It no longer checks review labels or a "Finn-loop review of <sha>" comment. Those existed to
# coordinate FOUR models reviewing each other's work. The project now runs ONE model with merge
# authority, so every label check was ceremony that could stall the loop but could never catch a
# defect. Removing them was not optional: `gate` is a required status check, so the moment
# `loop-approved` stopped being applied, the old gate would have gone red on everything and
# deadlocked the repo.
#
# It also no longer polls the `build` check-run. `build` is a required status check on `main`, so
# GitHub already refuses the merge unless it is green — the poll was belt-and-braces that cost up
# to ~400s of wall clock on every run.
#
# What remains are exactly the checks that do not depend on a second model existing:
#
#   1. Tier A paths       -> HOLD. The pipeline's own rulebook and the auth boundary.
#   2. Dangerous content  -> HOLD. Semantics a path list cannot see.
#   3. client_id landmine -> HOLD until the tenancy isolation test exists.
#
# HOLD keeps the check GREEN and simply does not enable auto-merge, so a human merges
# deliberately. It must never go red: `gate` is required, so a red hold would make every
# Tier A change unmergeable by anyone.

on:
  pull_request:
    types: [opened, reopened, synchronize]

permissions:
  contents: write # only to enable GitHub's native auto-merge; never a direct merge
  pull-requests: write # to comment when a change is held

concurrency:
  group: finn-gate-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Evaluate gate
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          set -euo pipefail
          hold() {
            echo "HELD FOR HUMAN: $1"
            echo "reason=$1" >> "$GITHUB_OUTPUT"
            echo "pass=false" >> "$GITHUB_OUTPUT"
            exit 0
          }

          git fetch --quiet origin "$BASE_REF"
          changed=$(git diff --name-only "origin/$BASE_REF...$HEAD_SHA")
          echo "Changed files:"; echo "$changed"

          # ---- 1. Tier A: the pipeline's own rulebook, and the auth boundary -------
          # Self-referential governance (.github/workflows, .zcode/skills, CODEOWNERS,
          # AGENTS.md, ROADMAP.md, the rule docs): a model that can merge changes here can
          # rewrite its own oversight with nobody seeing it. ROADMAP.md matters most now — the
          # standing product mandate lets the model add roadmap lines, so an unheld ROADMAP.md
          # would let it grant itself unbounded scope and merge that grant in the same step.
          # lib/auth.ts and middleware.ts: a subtly wrong session change is a silent live
          # vulnerability, not a visible bug, and no second model will catch it.
          #
          # Generated and append-only records are deliberately NOT held — AUDIT-LOG.md,
          # BUILT.md, DECISIONS.md, BUILD-LOG.md, CONCEPT-AUDIT.md, STATE-OF-THE-BUILD.md — or
          # the model could not write its own logs while running unattended.
          protected='^(lib/auth\.ts|middleware\.ts|\.github/workflows/.*|\.zcode/skills/.*|\.github/CODEOWNERS|AGENTS\.md|ROADMAP\.md|docs/(NORTH-STAR|AGENT-TIERS|PIPELINE|GAP-LEDGER|PRODUCT-VISION)\.md)$'
          if hit=$(printf '%s\n' "$changed" | grep -E "$protected" | head -3); then
            if [ -n "$hit" ]; then
              hold "touches protected path(s): $(printf '%s' "$hit" | tr '\n' ' ')"
            fi
          fi

          # ---- 2. Dangerous content in ADDED lines only ----------------------------
          # A path list misses semantics: a PR can add lib/sessionHelper.ts, or inline DDL in a
          # route handler, and evade any filename check.
          diff=$(git diff "origin/$BASE_REF...$HEAD_SHA" -- . ':(exclude)*.test.mts' ':(exclude)docs/**' ':(exclude)*.md' || true)
          added=$(printf '%s\n' "$diff" | grep -E '^\+' | grep -vE '^\+\+\+ ' || true)
          if [ -n "$added" ]; then
            patterns='jwt\.sign|jwtVerify|SignJWT|bcrypt|hashSync|compareSync|process\.env\.[A-Za-z_]*(SECRET|KEY|TOKEN|PASSWORD)|ALTER TABLE|CREATE TABLE|DROP TABLE|child_process|exec\(|eval\(|timingSafeEqual|randomBytes|Math\.random'
            if printf '%s\n' "$added" | grep -qE "$patterns"; then
              found=$(printf '%s\n' "$added" | grep -oE "$patterns" | sort -u | head -3 | tr '\n' ' ')
              hold "added dangerous content: $found"
            fi
            if printf '%s\n' "$added" | grep -q 'dangerouslySetInnerHTML'; then
              hold "adds dangerouslySetInnerHTML — model output must never reach an unsanitised sink"
            fi
            if printf '%s\n' "$added" | grep -q 'srcDoc' && ! printf '%s\n' "$added" | grep -q 'sandbox'; then
              hold "adds a srcDoc iframe with no sandbox attribute (GAP-LEDGER blocker 6)"
            fi
          fi

          # A new API route with no in-handler authorization. lib/route-auth.test.mts is the
          # enforced ratchet; this is the faster, clearer signal.
          newroutes=$(printf '%s\n' "$changed" | grep -E '^app/api/.*/route\.ts$' || true)
          for r in $newroutes; do
            if [ -f "$r" ] && ! grep -qE 'requireRole|requireAdmin|verifySessionRole|verifySession|verifyHealthSecret|consumeLoginToken' "$r"; then
              hold "route $r has no in-handler authorization (GAP-LEDGER §8)"
            fi
          done

          # ---- 3. The client_id landmine ------------------------------------------
          # Wiring tenancy before an isolation test exists detonates ~35 latent defects.
          # Phase 0.9 replaces the retrofit with a real boundary; until its test lands, hold.
          if [ ! -f "lib/portal-isolation.test.mts" ]; then
            if [ -n "$added" ] && printf '%s\n' "$added" | grep -qE 'assignProjectToClient|client_id\s*=|set client_id'; then
              hold "touches client_id / assignProjectToClient before lib/portal-isolation.test.mts exists (Phase 0.9)"
            fi
          fi

          echo "All gates clear."
          echo "pass=true" >> "$GITHUB_OUTPUT"
          echo "reason=all gates clear" >> "$GITHUB_OUTPUT"

      - name: Enable GitHub native auto-merge
        if: steps.gate.outputs.pass == 'true' && vars.FINN_AUTOMERGE == 'on'
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          # Does NOT merge. Asks GitHub to merge once every required check passes. `gate` is
          # itself required, so a later commit re-runs this and GitHub holds automatically if
          # the new diff is no longer eligible.
          gh pr merge "$PR" --auto --squash

      - name: Explain the hold
        if: steps.gate.outputs.pass != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          gh pr merge "$PR" --disable-auto || true
          gh pr comment "$PR" --body \
            "⏸️ **Held for a human.** ${{ steps.gate.outputs.reason }}

          Nothing is wrong with this PR — it is just not eligible to merge itself. Review it and merge by hand when you are satisfied. This check is green, so it does not block you." || true

      - name: Report result
        run: |
          if [ "${{ steps.gate.outputs.pass }}" = "true" ]; then
            echo "finn-gate: clear — ${{ steps.gate.outputs.reason }}"
          else
            # GREEN on purpose. A hold means "a human should merge this", not "something is
            # broken". Failing here would make every Tier A change unmergeable by anyone,
            # since `gate` is a required check.
            echo "::notice::finn-gate held for a human: ${{ steps.gate.outputs.reason }}"
          fi
