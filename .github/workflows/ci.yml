name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      # Node is pinned in ONE place: .nvmrc. The Dockerfile ships node:22-alpine,
      # so CI must stay on the same major or we are testing a runtime the artifact
      # never uses (GAP-LEDGER pattern 7). Node 20 was end-of-life in April 2026
      # and could not run the .mts test files at all.
      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      # Tests existed on main but nothing ran them. An unrun test suite is not a
      # verifier - see GAP-LEDGER pattern 1.
      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  lint:
    # Separate from `build` deliberately: eslint-suppressions.json baselines the
    # ~68 pre-existing violations (mostly GAP-LEDGER pattern 1 catch blocks) so
    # this job is green today, but `build` (finn-gate's only required check) must
    # stay unaffected either way while that baseline is worked down (issue #109 is
    # the detector; remediation is separate — NG-2).
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint
